# Static host for the game bundle. Hashed assets cache hard (immutable); index.html always revalidates
# so a new deploy shows up immediately. Single-page: unknown paths fall back to index.html.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
