<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Idle Bartender</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c76914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Idle Bartender" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* matches the bottom of the bar art, so any sliver the canvas misses blends in (never black) */
        background: #c76914;
        overflow: hidden;
      }
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh; /* fallback */
        height: 100dvh; /* modern mobile: tracks the visible viewport */
        overflow: hidden;
        touch-action: none;
      }
      @media all and (display-mode: standalone) {
        #game {
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          height: auto;
        }
      }
      #game canvas {
        display: block;
      }

      /* ── DOM UI overlay ─────────────────────────────────────────────────── */
      #ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        color: #fff8e7;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #ui * {
        box-sizing: border-box;
      }

      #hud {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 12px);
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      }
      .chip {
        background: rgba(18, 12, 5, 0.62);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        backdrop-filter: blur(16px) saturate(1.3);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        padding: 9px 18px;
        font-weight: 800;
        font-size: 23px;
        line-height: 1.15;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.55);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .chip .small {
        font-size: 14px;
        font-weight: 600;
        color: #9fe0b0;
      }
      #coins {
        color: #ffd873;
      }
      #tokens {
        color: #cbb8ff;
      }
      #score {
        min-width: 96px;
      }
      #score.combo {
        color: #ffd54a;
        box-shadow: 0 0 0 2px rgba(255, 213, 74, 0.5), 0 8px 22px rgba(0, 0, 0, 0.35);
      }

      #hud-buttons {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(env(safe-area-inset-top) + 104px);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px;
      }
      .btn {
        pointer-events: auto;
        border: none;
        border-radius: 18px;
        padding: 13px 26px;
        font-family: inherit;
        font-size: 22px;
        font-weight: 800;
        color: #fff8e7;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.28);
        transition: transform 0.06s ease, filter 0.12s ease;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn:disabled {
        filter: grayscale(0.6) brightness(0.72);
      }
      .btn .sub {
        display: block;
        font-size: 14px;
        font-weight: 600;
        opacity: 0.92;
        margin-top: 2px;
      }
      .teal {
        background: linear-gradient(180deg, #33c2b3, #1f8c80);
      }
      .purple {
        background: linear-gradient(180deg, #9a7ce6, #6b48c4);
      }
      .amber {
        background: linear-gradient(180deg, #f2ab52, #cd7a28);
      }
      .green {
        background: linear-gradient(180deg, #54c977, #2f9350);
      }

      #modal-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
      }
      .card {
        width: min(560px, 94vw);
        max-height: 86vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: linear-gradient(180deg, rgba(36, 25, 12, 0.98), rgba(24, 16, 8, 0.98));
        border: 1px solid rgba(255, 208, 138, 0.32);
        border-radius: 28px;
        padding: 20px 18px 22px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .card h2 {
        margin: 2px 0 16px;
        text-align: center;
        font-size: 32px;
        color: #ffd9a0;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      .card .x {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #fff8e7;
        font-size: 24px;
        font-weight: 800;
      }
      .card-wrap {
        position: relative;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.045);
        margin-bottom: 10px;
      }
      .row .info {
        flex: 1;
        min-width: 0;
      }
      .row .name {
        font-size: 21px;
        font-weight: 800;
      }
      .row .desc {
        font-size: 14px;
        color: #cdbfa6;
        margin-top: 1px;
      }
      .row .lvl {
        font-size: 13px;
        color: #bfe9ff;
        margin-top: 3px;
      }
      .buy {
        pointer-events: auto;
        flex: none;
        border: none;
        border-radius: 14px;
        padding: 12px 12px;
        min-width: 132px;
        font-family: inherit;
        font-weight: 800;
        font-size: 17px;
        color: #fff8e7;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .buy:active {
        transform: scale(0.96);
      }
      .buy .cost {
        display: block;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.92;
        margin-top: 2px;
      }
      .buy.ok {
        background: linear-gradient(180deg, #54c977, #2f9350);
      }
      .buy.no {
        background: linear-gradient(180deg, #8a5a4f, #6e3f36);
      }
      .buy.max {
        background: #4a4238;
      }
      .buy.tok {
        background: linear-gradient(180deg, #9a7ce6, #6b48c4);
      }
      .center-msg {
        text-align: center;
        font-size: 20px;
        line-height: 1.45;
        padding: 4px 4px 16px;
      }
      .section {
        text-align: center;
        color: #ffd9a0;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0.5px;
        margin: 14px 0 10px;
      }
      .big {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 16px;
        font-size: 22px;
      }
      .boon {
        pointer-events: auto;
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 12px;
        color: #eafcff;
        background: linear-gradient(180deg, #2f7f8c, #1f5c66);
      }
      .boon:active {
        transform: scale(0.98);
      }
      .boon .bn {
        font-size: 22px;
        font-weight: 800;
      }
      .boon .bd {
        font-size: 15px;
        opacity: 0.94;
        margin-top: 4px;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        font-size: 30px;
        font-weight: 800;
        color: #ffe08a;
        text-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, top 0.9s ease;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
