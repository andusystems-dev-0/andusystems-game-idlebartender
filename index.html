<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Idle Bartender</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c76914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- opaque status bar at the top; web content sits BELOW it and fills to the bottom edge (translucent
         mode left an unpaintable strip at the bottom / home-indicator area on this iOS). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Idle Bartender" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* matches the bottom of the bar art so any sliver the canvas misses blends in (never black) */
        background: #c76914;
        overflow: hidden;
      }
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }
      /* Real <img> backdrop behind the (transparent) canvas. An image ELEMENT paints its pixels into the
         iOS safe-area strip (a CSS background only fills that strip with a COLOR) — so the home-indicator
         area shows the bar art, not a flat bar. object-fit:cover matches the game's scale-by-height. */
      #bgimg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        z-index: 0;
        pointer-events: none;
      }
      #game {
        z-index: 1;
      }

      /* ── DOM UI overlay ─────────────────────────────────────────────────── */
      :root {
        --glass: rgba(26, 18, 9, 0.72);
        --hair: rgba(255, 216, 150, 0.22);
        --ink: #f6edde;
        --muted: #c3b39a;
        --gold: #ffd58a;
      }
      #ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        touch-action: none;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #ui * {
        box-sizing: border-box;
      }
      /* only real controls capture taps; everything else lets flicks reach the canvas */
      #hud,
      #hud-buttons,
      #modal-root,
      #toast,
      .chip {
        pointer-events: none;
      }
      .btn,
      .buy,
      .boon,
      .backdrop,
      .card,
      .x,
      .banner {
        pointer-events: auto;
      }

      /* top stats row (coins / score / tokens), over the bottle shelf above the table */
      #hud {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 6px);
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
      }
      .chip {
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
        backdrop-filter: blur(18px) saturate(1.2);
        border: 1px solid var(--hair);
        border-radius: 14px;
        padding: 6px 13px;
        font-weight: 700;
        font-size: 18px;
        line-height: 1.1;
        letter-spacing: 0.2px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      .chip .small {
        font-size: 11px;
        font-weight: 600;
        color: #93dca6;
      }
      #coins {
        color: #ffd873;
      }
      #tokens {
        color: #cbb8ff;
      }
      #score {
        min-width: 90px;
      }
      #score.combo {
        color: #ffd54a;
        border-color: rgba(255, 213, 74, 0.55);
      }

      /* actions live at the bottom corners — clear of the table surface, flanking the launch zone */
      #hud-buttons {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom) + 16px);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      }
      .btn {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 11px 22px;
        font-family: inherit;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.3px;
        color: var(--ink);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition: transform 0.06s ease, filter 0.12s ease;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn:disabled {
        filter: grayscale(0.55) brightness(0.72);
      }
      .btn .sub {
        display: block;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.9;
        margin-top: 1px;
      }
      .teal {
        background: linear-gradient(180deg, #2bb7a8, #1c837a);
      }
      .purple {
        background: linear-gradient(180deg, #8f70e0, #5f3fb8);
      }
      .amber {
        background: linear-gradient(180deg, #eda548, #c2701f);
      }
      .green {
        background: linear-gradient(180deg, #4cc06f, #2b8449);
      }

      .banner {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 168px);
        left: 50%;
        transform: translateX(-50%);
        max-width: 88vw;
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid var(--hair);
        border-radius: 16px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        animation: bannerIn 0.35s ease both;
      }
      @keyframes bannerIn {
        from {
          opacity: 0;
          transform: translate(-50%, -10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      #modal-root {
        position: absolute;
        inset: 0;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.58);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
      }
      .card {
        position: relative;
        width: min(540px, 92vw);
        max-height: 84vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: linear-gradient(180deg, rgba(32, 22, 11, 0.97), rgba(22, 15, 7, 0.98));
        border: 1px solid var(--hair);
        border-radius: 24px;
        padding: 22px 18px 20px;
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.62);
      }
      .card h2 {
        margin: 0 0 6px;
        text-align: center;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.6px;
        color: var(--gold);
      }
      .card .sub-h {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 14px;
      }
      .x {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        font-size: 20px;
        font-weight: 800;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .row:last-of-type {
        border-bottom: none;
      }
      .row .info {
        flex: 1;
        min-width: 0;
      }
      .row .name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .row .desc {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .row .lvl {
        font-size: 12px;
        color: #a9def7;
        margin-top: 4px;
        font-weight: 600;
      }
      .buy {
        flex: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 13px;
        padding: 11px 12px;
        min-width: 118px;
        font-family: inherit;
        font-weight: 800;
        font-size: 15px;
        color: var(--ink);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      }
      .buy:active {
        transform: scale(0.96);
      }
      .buy:disabled {
        filter: grayscale(0.5) brightness(0.78);
      }
      .buy .cost {
        display: block;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.92;
        margin-top: 2px;
      }
      .buy.ok {
        background: linear-gradient(180deg, #4cc06f, #2b8449);
      }
      .buy.no {
        background: linear-gradient(180deg, #7c5348, #5c3a31);
      }
      .buy.max {
        background: #463e33;
      }
      .buy.tok {
        background: linear-gradient(180deg, #8f70e0, #5f3fb8);
      }
      .center-msg {
        text-align: center;
        font-size: 17px;
        line-height: 1.5;
        padding: 6px 4px 14px;
        color: var(--ink);
      }
      .section {
        text-align: center;
        color: var(--gold);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 1.4px;
        margin: 18px 0 6px;
        opacity: 0.92;
      }
      .big {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 15px;
        font-size: 20px;
        border-radius: 16px;
      }
      .boon {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        padding: 15px;
        margin-bottom: 12px;
        color: #eafcff;
        background: linear-gradient(180deg, #2c7c88, #1c5760);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      }
      .boon:active {
        transform: scale(0.98);
      }
      .boon .bn {
        font-size: 20px;
        font-weight: 800;
      }
      .boon .bd {
        font-size: 14px;
        opacity: 0.94;
        margin-top: 4px;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: 800;
        color: #ffe08a;
        text-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
        opacity: 0;
        transition: opacity 0.9s ease, top 0.9s ease;
      }
    </style>
  </head>
  <body>
    <img id="bgimg" alt="" />
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
