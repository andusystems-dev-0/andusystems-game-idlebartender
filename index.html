<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Idle Bartender</title>
    <!-- Browser tab + home-screen/PWA icons. iOS "Add to Home Screen" uses apple-touch-icon. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1e3f" />
    <!-- Launch full-screen (no Safari chrome) when opened from the iOS home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Idle Bartender" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1e3f;
        overflow: hidden;
      }
      /* Pin to the *visible* viewport. On mobile Safari 100vh includes the area behind the toolbars,
         which hid the bottom of the canvas (the drink); 100dvh (+ JS innerHeight fallback in main.ts)
         tracks the actually-visible height. touch-action:none keeps flicks from scrolling the page. */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh; /* fallback for old browsers */
        height: 100dvh; /* visible viewport on modern mobile */
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
