name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

# One web build → published to web (uat/prod) and fed to the shared mobile packager.
# See andusystems-games/docs/{environments,mobile-release}.md.
jobs:
  web:
    runs-on: [self-hosted, linux, andusystems-mgmt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: meta
        run: |
          echo "slug=$(jq -r .slug game.json)" >> "$GITHUB_OUTPUT"
      - run: npm ci

      # UAT build → R2 uat/<slug>/ (served privately via the Pangolin static host)
      - run: cp .env.uat.example .env.uat && npm run build -- --mode uat
      - name: publish uat → R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 sync dist "s3://andusystems-games-bundles/uat/${{ steps.meta.outputs.slug }}/" \
            --endpoint-url "$R2_ENDPOINT" --delete
      - uses: actions/upload-artifact@v4
        with: { name: web-uat, path: dist }

      # Prod build → R2 prod/<slug>/ (public on Cloudflare). Promote after UAT sign-off.
      - if: github.ref == 'refs/heads/main'
        run: cp .env.prod.example .env.prod && npm run build -- --mode prod
      - name: publish prod → R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 sync dist "s3://andusystems-games-bundles/prod/${{ steps.meta.outputs.slug }}/" \
            --endpoint-url "$R2_ENDPOINT" --delete
      - uses: actions/upload-artifact@v4
        with: { name: web-prod, path: dist }

  # Package the same bundle into the shared offline Capacitor shell → stores (no per-game native code).
  mobile-beta:
    needs: web
    uses: andusystems-dev-0/andusystems-games/.github/workflows/mobile-package.yml@main
    with:
      web_artifact: web-uat
      track: beta
    secrets: inherit
